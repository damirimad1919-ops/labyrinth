<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Лабиринт знаний</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Unbounded:wght@500;700;800&display=swap">
<style>
body{margin:0}
/* Layout: квадратное поле из 24 клеток по периметру, в центре кубик и ход; справа — панель игроков. Единая тёмная «ночная» тема игрового стола. */
:root{
  --table:#141a2f; --felt:#1d2645; --felt-2:#283461; --line:#3b4778;
  --ink:#f2eee4; --muted:#a6aecb; --gold:#e9c46a;
  --hist:#b5523b; --geo:#3f8a5c; --sci:#3b6fb5; --lit:#8a4fa0; --logic:#c48419; --math:#23878d; --nature:#6b8a1e; --misc:#a8456d;
  --good:#4fbf7f; --bad:#e5534b;
  --display:'Unbounded','Arial Black',system-ui,sans-serif;
  --body:'Golos Text',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--table);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;
  background-image:radial-gradient(ellipse at 30% 20%, #1e2850 0%, transparent 60%),radial-gradient(ellipse at 80% 90%, #22193d 0%, transparent 55%);
  background-attachment:fixed}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 32px;max-width:1280px;margin:0 auto}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;letter-spacing:-.01em}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.btn{border:0;border-radius:10px;padding:12px 20px;font-weight:600;background:var(--felt-2);color:var(--ink);transition:transform .12s, background .12s}
.btn:hover:not(:disabled){background:#34417a}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--gold);color:#1a1606}
.btn.primary:hover:not(:disabled){background:#f3d385}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
kbd{font-family:var(--body);font-size:12px;font-weight:700;border:1px solid var(--line);border-bottom-width:3px;border-radius:6px;padding:1px 7px;background:var(--felt);color:var(--ink);display:inline-block;min-width:1.6em;text-align:center}

/* ---------- Setup ---------- */
.setup{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:32px;align-items:start}
.hero h1{font-size:clamp(34px,6vw,64px);font-weight:800;line-height:1.02}
.hero h1 span{color:var(--gold)}
.hero p.lead{color:var(--muted);font-size:17px;max-width:52ch;margin:16px 0 24px}
.rules{display:grid;gap:10px;margin:0;padding:0;list-style:none;max-width:60ch}
.rules li{display:grid;grid-template-columns:34px minmax(0,1fr);gap:12px;align-items:start}
.rules .ic{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;font-size:17px;font-weight:700;color:#fff}
.rules b{font-weight:600}
.panel{background:var(--felt);border:1px solid var(--line);border-radius:16px;padding:22px;display:grid;gap:18px}
.prow{display:grid;grid-template-columns:14px minmax(0,1fr) auto;gap:12px;align-items:center}
.swatch{width:14px;height:14px;border-radius:50%;box-shadow:0 0 0 2px var(--table),0 0 0 3px currentColor}
.prow input{width:100%;background:var(--table);border:1px solid var(--line);border-radius:8px;padding:10px 12px;color:var(--ink);font:inherit;min-width:0}
.prow.off{opacity:.35}
.opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.opts label{display:grid;gap:6px;font-size:13px;color:var(--muted)}
.opts select{background:var(--table);border:1px solid var(--line);border-radius:8px;padding:9px 10px;color:var(--ink);font:inherit;width:100%}
.panel .btn.primary{font-size:17px;padding:15px}

/* ---------- Game ---------- */
.game{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:24px;align-items:start}
.board{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-template-rows:repeat(7,minmax(0,1fr));gap:5px;
  aspect-ratio:1;width:100%;max-width:min(100%,82vh);margin:0 auto;background:var(--felt);border:1px solid var(--line);border-radius:18px;padding:8px}
.cell{position:relative;border-radius:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  color:#fff;min-width:0;overflow:hidden;box-shadow:inset 0 -3px 0 rgba(0,0,0,.22)}
.cell .ci{font-size:clamp(14px,2.6vw,28px);line-height:1;font-weight:700}
.cell .cl{font-size:clamp(7px,.85vw,11px);font-weight:600;letter-spacing:.04em;text-transform:uppercase;opacity:.9;text-align:center;padding:0 2px;line-height:1.1}
.cell.sp{background:var(--felt-2);box-shadow:inset 0 0 0 2px var(--line)}
.cell.sp .ci{color:var(--gold)}
.cell.start{background:var(--gold);color:#1a1606}
.cell.start .ci{color:#1a1606}
.cell .num{position:absolute;top:3px;left:5px;font-size:9px;opacity:.55;font-variant-numeric:tabular-nums}
.tokens{position:absolute;bottom:4px;left:0;right:0;display:flex;justify-content:center;gap:2px;flex-wrap:wrap}
.tok{width:clamp(9px,1.5vw,15px);height:clamp(9px,1.5vw,15px);border-radius:50%;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.5)}
.tok.cur{animation:bob 1s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
.cell.landed{animation:flash .6s ease-out}
@keyframes flash{0%{filter:brightness(1.8)}100%{filter:none}}
.center{grid-row:2/7;grid-column:2/7;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(6px,1.4vw,14px);text-align:center;padding:8px;min-width:0}
.center .who{font-family:var(--display);font-size:clamp(15px,2.6vw,28px);font-weight:700;overflow-wrap:anywhere}
.center .who b{color:var(--pc)}
.dice{width:clamp(56px,10vw,96px);aspect-ratio:1;background:#f6f2e8;border-radius:18%;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:14%;gap:6%;box-shadow:0 6px 0 #bfb7a3,0 10px 22px rgba(0,0,0,.4)}
.dice i{border-radius:50%;background:transparent}
.dice i.on{background:#1d2645}
.dice.rolling{animation:shake .12s linear infinite}
@keyframes shake{0%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}100%{transform:rotate(-8deg)}}
.center .last{font-size:clamp(11px,1.3vw,14px);color:var(--muted);max-width:36ch;min-height:2.6em}
.center .hint{font-size:12px;color:var(--muted)}

.side{display:grid;gap:16px}
.card{background:var(--felt);border:1px solid var(--line);border-radius:14px;padding:16px}
.roundline{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.roundline .big{font-family:var(--display);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--table);border-radius:99px;overflow:hidden;margin-top:10px}
.bar>i{display:block;height:100%;background:var(--gold);border-radius:99px;transition:width .3s}
.players{display:grid;gap:10px}
.pl{display:grid;grid-template-columns:6px minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--felt);border:1px solid var(--line);border-radius:12px;padding:12px 14px 12px 0;overflow:hidden;transition:transform .2s, border-color .2s}
.pl .stripe{align-self:stretch;background:var(--pc)}
.pl.active{border-color:var(--pc);transform:translateX(-4px);box-shadow:0 0 0 1px var(--pc)}
.pl .nm{font-weight:700;overflow-wrap:anywhere}
.pl .meta{font-size:12px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
.pl .sc{font-family:var(--display);font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--pc)}
.pl .sc.bump{animation:bump .5s}
@keyframes bump{40%{transform:scale(1.35)}}
.log{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:6px;font-size:13px;color:var(--muted);max-height:220px;overflow:auto}
.log li:first-child{color:var(--ink)}
.legend{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 12px;font-size:12px;color:var(--muted);margin-top:8px}
.legend span{display:flex;gap:6px;align-items:center}
.legend em{font-style:normal;width:18px;height:18px;border-radius:5px;display:grid;place-items:center;color:#fff;font-size:11px;font-weight:700;flex:none}

/* ---------- Modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(8,10,22,.78);backdrop-filter:blur(4px);display:grid;place-items:center;z-index:50;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));overflow:auto}
.modal{width:100%;max-width:760px;background:var(--felt);border:1px solid var(--line);border-radius:18px;padding:clamp(18px,3vw,30px);display:grid;gap:18px;animation:pop .22s ease-out}
@keyframes pop{from{transform:scale(.96);opacity:.4}}
.mhead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:8px;border-radius:99px;padding:6px 14px 6px 8px;font-weight:600;font-size:14px;color:#fff}
.chip .ci{width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.22);display:grid;place-items:center;font-size:13px}
.stars{color:var(--gold);letter-spacing:2px;font-size:15px}
.qtext{font-family:var(--display);font-size:clamp(18px,2.6vw,26px);font-weight:500;line-height:1.3}
.answers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.ans{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center;text-align:left;background:var(--felt-2);border:2px solid transparent;border-radius:12px;padding:14px 16px;font-size:16px;font-weight:500;transition:background .12s,border-color .12s}
.ans:hover:not(:disabled){border-color:var(--gold)}
.ans:disabled{cursor:default}
.ans .k{font-size:12px;font-weight:700;width:26px;height:26px;border-radius:7px;display:grid;place-items:center;background:var(--table);color:var(--muted)}
.ans.gone{visibility:hidden}
.ans.right{background:color-mix(in srgb,var(--good) 30%,var(--felt-2));border-color:var(--good)}
.ans.wrong{background:color-mix(in srgb,var(--bad) 28%,var(--felt-2));border-color:var(--bad);opacity:.85}
.ans.dim{opacity:.4}
.timer{height:8px;background:var(--table);border-radius:99px;overflow:hidden}
.timer>i{display:block;height:100%;width:100%;background:var(--gold);border-radius:99px}
.timer.low>i{background:var(--bad)}
.mfoot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.status{font-weight:600;font-size:16px;min-height:1.4em}
.status.good{color:var(--good)}.status.bad{color:var(--bad)}
.buzzers{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.buzz{border:2px solid var(--pc);background:color-mix(in srgb,var(--pc) 14%,var(--felt));border-radius:12px;padding:10px 12px;display:grid;gap:4px;justify-items:start;text-align:left}
.buzz .bn{font-weight:700;overflow-wrap:anywhere}
.buzz small{color:var(--muted);font-size:12px}
.buzz.on{background:var(--pc);color:#141a2f;animation:bump .4s}
.buzz.on small{color:#141a2f}
.buzz.locked{opacity:.35;text-decoration:line-through}
.choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.choices.four{grid-template-columns:repeat(4,minmax(0,1fr))}
.choice{border:0;border-radius:12px;padding:16px 12px;display:grid;gap:6px;justify-items:center;text-align:center;color:#fff;font-weight:600;box-shadow:inset 0 -4px 0 rgba(0,0,0,.25)}
.choice .ci{font-size:28px;line-height:1}
.choice small{font-weight:500;opacity:.85;font-size:12px}
.choice:hover{filter:brightness(1.12)}
.diff{background:var(--felt-2);color:var(--ink)}
.diff .stars{font-size:18px}
.diff b{font-family:var(--display);font-size:22px}
.cardbig{border-radius:16px;padding:26px;background:linear-gradient(140deg,var(--felt-2),#3a2f6b);border:1px solid var(--line);text-align:center;display:grid;gap:10px}
.cardbig .ci{font-size:44px;color:var(--gold);line-height:1}
.duelbar{display:flex;justify-content:center;align-items:center;gap:16px;font-family:var(--display);font-size:20px;flex-wrap:wrap}
.duelbar b{color:var(--pc)}
.duelbar .vs{font-size:28px;font-variant-numeric:tabular-nums}
.rank{display:grid;gap:10px}
.rank .r{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--felt-2);border-radius:12px;padding:12px 16px;border-left:6px solid var(--pc)}
.rank .pos{font-family:var(--display);font-size:22px;color:var(--muted)}
.rank .r:first-child{background:color-mix(in srgb,var(--gold) 22%,var(--felt-2))}
.rank .r:first-child .pos{color:var(--gold)}
.rank .pts{font-family:var(--display);font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.center-txt{text-align:center}

@media (max-width:960px){
  .game{grid-template-columns:minmax(0,1fr)}
  .setup{grid-template-columns:minmax(0,1fr)}
  .players{grid-template-columns:repeat(2,minmax(0,1fr))}
  .pl.active{transform:none}
}
@media (max-width:560px){
  .cell .cl,.cell .num{display:none}
  .answers{grid-template-columns:minmax(0,1fr)}
  .choices,.choices.four{grid-template-columns:repeat(2,minmax(0,1fr))}
  .opts{grid-template-columns:minmax(0,1fr)}
  .players{grid-template-columns:minmax(0,1fr)}
  .board{padding:5px;gap:3px}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>

const $ = s=>document.querySelector(s);
const esc = s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rnd = (a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick = a=>a[Math.floor(Math.random()*a.length)];
const shuffle = a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const wait = ms=>new Promise(r=>setTimeout(r,RM?Math.min(ms,60):ms));
function plural(n,a,b,c){n=Math.abs(n)%100;const n1=n%10;if(n>10&&n<20)return c;if(n1>1&&n1<5)return b;if(n1===1)return a;return c}
const pts = n=>`${n} ${plural(n,'очко','очка','очков')}`;

let AC=null;
function beep(f=440,d=.12,type='sine',v=.08){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(AC.destination);const t=AC.currentTime;g.gain.exponentialRampToValueAtTime(.0001,t+d);o.start(t);o.stop(t+d)}catch(e){}}
const sfx={good(){beep(660,.1);setTimeout(()=>beep(880,.16),90)},bad(){beep(200,.25,'sawtooth',.05)},buzz(){beep(520,.08,'square',.05)},step(){beep(300,.05,'triangle',.04)},tick(){beep(900,.03,'square',.02)}};

/* ================== МАТЕМАТИКА ================== */
function distract(c, extra=[]){
  const cand = shuffle([...extra, c+1,c-1,c+2,c-2,c+10,c-10,c+5,c-5,c*2,Math.round(c*1.1)]).filter(x=>x!==c&&x>=0&&Number.isInteger(x));
  const out=[];for(const x of cand){if(!out.includes(x))out.push(x);if(out.length===3)break}
  while(out.length<3){const x=c+rnd(3,20);if(!out.includes(x)&&x!==c)out.push(x)}
  return out;
}
function genMath(d){
  let text,c,ex=[];
  const t = d===1?pick(['add','mul','sub']):d===2?pick(['mix','pct','eq','sq']):pick(['mul2','gcd','sum','pow','diff']);
  switch(t){
    case 'add':{const a=rnd(12,89),b=rnd(12,89);text=`${a} + ${b} = ?`;c=a+b;break}
    case 'sub':{const a=rnd(40,99),b=rnd(11,a-5);text=`${a} − ${b} = ?`;c=a-b;break}
    case 'mul':{const a=rnd(3,9),b=rnd(4,12);text=`${a} × ${b} = ?`;c=a*b;ex=[a*(b+1),a*(b-1)];break}
    case 'mix':{const a=rnd(6,15),b=rnd(4,9),k=rnd(10,50);text=`${a} × ${b} + ${k} = ?`;c=a*b+k;ex=[a*(b+k),a*b-k];break}
    case 'pct':{const p=pick([10,20,25,50,75]),n=rnd(2,20)*20;text=`Сколько будет ${p}% от ${n}?`;c=n*p/100;break}
    case 'eq':{const x=rnd(2,12),a=rnd(2,9),b=rnd(1,20);text=`Найдите x: ${a}x + ${b} = ${a*x+b}`;c=x;ex=[x+1,x-1,x+2];break}
    case 'sq':{const n=rnd(11,25);text=`${n}² = ?`;c=n*n;ex=[n*n+n,n*n-n,n*2];break}
    case 'mul2':{const a=rnd(12,39),b=rnd(12,39);text=`${a} × ${b} = ?`;c=a*b;ex=[c+a,c-b,c+10];break}
    case 'gcd':{const g=rnd(6,18),[m,n]=pick([[2,3],[3,4],[2,5],[3,5],[4,5],[5,6],[3,7],[4,7],[5,7],[2,7]]);text=`Наибольший общий делитель чисел ${g*m} и ${g*n}?`;c=g;ex=[g*2,Math.max(1,g/2|0),g+1,g*m];break}
    case 'sum':{const n=pick([20,30,40,50,100]);text=`Сумма всех чисел от 1 до ${n}?`;c=n*(n+1)/2;ex=[n*n/2,n*(n-1)/2,c+n];break}
    case 'pow':{const n=rnd(8,12);text=`2 в степени ${n} = ?`;c=2**n;ex=[2**(n-1),2**(n+1),c+2];break}
    case 'diff':{const a=rnd(30,60),b=rnd(20,a-3);text=`${a}² − ${b}² = ?`;c=a*a-b*b;ex=[(a-b)**2,c+10,c-a];break}
  }
  const opts = shuffle([c,...distract(c,ex)]).map(String);
  return {text, opts, correct:opts.indexOf(String(c)), cat:'math', d};
}

function getQ(cat,d){
  if(cat==='math') return genMath(d);
  let pool = Q.filter(q=>q[0]===cat&&q[1]===d&&!S.used.has(q.id));
  if(!pool.length) pool = Q.filter(q=>q[0]===cat&&!S.used.has(q.id));
  if(!pool.length){ Q.filter(q=>q[0]===cat).forEach(q=>S.used.delete(q.id)); pool = Q.filter(q=>q[0]===cat&&q[1]===d); }
  const q = pick(pool); S.used.add(q.id);
  const opts = shuffle(q.slice(3,7));
  return {text:q[2], opts, correct:opts.indexOf(q[3]), cat, d:q[1]};
}

function cellRC(i){
  if(i<=6) return [1,i+1];
  if(i<=12) return [i-5,7];
  if(i<=18) return [7,7-(i-12)];
  return [7-(i-18),1];
}

async function roll(){
  if(!S||S.busy||!$('#overlay').hidden) return;
  S.busy=true; $('#rollBtn').disabled=true;
  const dice=$('#dice'); dice.classList.add('rolling');
  for(let k=0;k<9;k++){dice.innerHTML=diceHTML(rnd(1,6));sfx.tick();await wait(70)}
  const n=rnd(1,6); S.dice=n; dice.innerHTML=diceHTML(n); dice.classList.remove('rolling');
  const p=S.players[S.cur];
  log(`${p.name} выбрасывает ${n}`);
  await wait(250);
  for(let s=0;s<n;s++){
    p.pos=(p.pos+1)%BOARD.length;
    if(p.pos===0){p.score+=1;log(`${p.name} проходит Старт: +1`)}
    S.landed=null; sfx.step(); renderAll(); await wait(230);
  }
  S.landed=p.pos; renderAll();
  await wait(350);
  landOn(S.cur);
}
function landOn(pi){
  const p=S.players[pi], t=BOARD[p.pos];
  if(CATS[t]) return chooseDifficulty(pi,t);
  if(t==='blitz') return startBlitz();
  if(t==='duel') return chooseOpponent(pi);
  if(t==='chance') return drawChance(pi);
  if(t==='choice') return chooseCategory(pi);
  log(`${p.name} отдыхает на Старте`); endTurn();
}
function endTurn(){
  closeModal(); clearTimer();
  if(S.extra){S.extra=false;}
  else{
    S.cur=(S.cur+1)%S.players.length;
    if(S.cur===0){S.round++; if(S.round>S.maxRounds) return endGame();}
  }
  S.busy=false; S.landed=null; renderAll();
}

  let head = c.type==='blitz'?`<span class="chip" style="background:var(--felt-2)"><span class="ci" style="color:var(--gold)">ϟ</span>Блиц · ${CATS[q.cat].name}</span><span class="muted">Верно +2 · ошибка −1</span>`
           : c.type==='duel'?`<span class="chip" style="background:var(--felt-2)"><span class="ci" style="color:var(--gold)">⚔&#xFE0E;</span>Дуэль · вопрос ${S.duel.n} · ${CATS[q.cat].name}</span>`
           : `${catChip(q.cat)}<span><span class="stars">${stars(q.d)}</span> <span class="muted">${c.title?esc(c.title)+' · ':''}+${c.value}${c.penalty?` / −${c.penalty}`:''} · отвечает <b style="color:${P[c.answerer].color}">${esc(P[c.answerer].name)}</b></span></span>`;
  let duelbar = c.type==='duel'?`<div class="duelbar"><b style="--pc:${P[S.duel.a].color}">${esc(P[S.duel.a].name)}</b><span class="vs">${S.duel.wins[0]} : ${S.duel.wins[1]}</span><b style="--pc:${P[S.duel.b].color}">${esc(P[S.duel.b].name)}</b></div>`:'';
  let buzzers = multi?`<div class="buzzers">${c.eligible.map(i=>`<button class="buzz ${c.answerer===i?'on':''} ${c.locked.has(i)?'locked':''}" style="--pc:${P[i].color}" data-buzz="${i}" ${c.done||c.locked.has(i)||c.answerer!==null?'disabled':''}><span class="bn">${esc(P[i].name)}</span><small>жми <kbd>${P[i].key.label}</kbd> / ${P[i].key.ru}</small></button>`).join('')}</div>`:'';
  const canAnswer = !c.done && c.answerer!==null;
  const answers = q.opts.map((o,i)=>{
    let cls='';
    if(c.hidden.has(i)) cls='gone';
    if(c.wrong.has(i)) cls='wrong';
    if(c.done){ if(i===q.correct) cls='right'; else if(c.picked===i) cls='wrong'; else if(!c.wrong.has(i)) cls+=' dim'; }
    return `<button class="ans ${cls}" data-opt="${i}" data-key="${i+1}" ${!canAnswer||c.hidden.has(i)||c.wrong.has(i)?'disabled':''}><span class="k">${i+1}</span><span>${esc(o)}</span></button>`;
  }).join('');
  const ap = c.answerer!==null?P[c.answerer]:null;
  let status = c.msg||(multi?(c.answerer===null?'Кто знает ответ? Жмите свою клавишу!':`Отвечает ${ap.name} — клавиши 1–4`):'Выберите ответ: клавиши 1–4 или клик');
  const joker = c.type==='solo'&&!c.done&&ap.joker>0&&c.hidden.size===0 ? `<button class="btn" data-act="joker">50 / 50 <span class="muted">(осталось ${ap.joker})</span></button>`:'';
  const next = c.done?`<button class="btn primary" data-act="next" data-default>Дальше <kbd style="margin-left:6px">Enter</kbd></button>`:'';
  openModal(`
    <div class="mhead">${head}</div>
    ${duelbar}
    <div class="qtext">${esc(q.text)}</div>
    ${buzzers}
    <div class="answers">${answers}</div>
    ${c.done?'':`<div class="timer" id="tbar"><i></i></div>`}
    <div class="mfoot"><div class="status ${c.statusCls||''}">${esc(status)}</div><div style="display:flex;gap:10px;flex-wrap:wrap">${joker}${next}</div></div>`,
    {joker:useJoker, next:()=>{const f=ctx.onNext;f?f():endTurn()}});
}
function useJoker(){
  const p=S.players[ctx.answerer]; if(p.joker<=0||ctx.done) return;
  p.joker--; const wrongs=shuffle(ctx.q.opts.map((_,i)=>i).filter(i=>i!==ctx.q.correct)).slice(0,2);
  wrongs.forEach(i=>ctx.hidden.add(i)); log(`${p.name} берёт подсказку 50/50`);
  const left=ctx.timerEnd; renderQ(); renderSide(); resumeTimer(left);
}
function startTimer(sec,onEnd){
  clearTimer(); ctx.timerTotal=sec*1000; ctx.timerEnd=Date.now()+sec*1000; ctx.onTimeout=onEnd; tickTimer();
  timerId=setInterval(tickTimer,100);
}
function resumeTimer(end){ clearTimer(); ctx.timerEnd=end; tickTimer(); timerId=setInterval(tickTimer,100); }
let lastSec=null;
function tickTimer(){
  const left=ctx.timerEnd-Date.now(), bar=$('#tbar');
  if(bar){bar.firstElementChild.style.width=Math.max(0,left/ctx.timerTotal*100)+'%';bar.classList.toggle('low',left<5000)}
  const sec=Math.ceil(left/1000); if(left<5000&&sec!==lastSec&&left>0){sfx.tick();lastSec=sec}
  if(left<=0){clearTimer(); ctx.onTimeout&&ctx.onTimeout();}
}
function clearTimer(){ if(timerId){clearInterval(timerId);timerId=null} }

function answer(i){
  if(!ctx||ctx.done||ctx.answerer===null||ctx.hidden.has(i)||ctx.wrong.has(i)) return;
  clearTimer();
  if(ctx.type==='solo') resolveSolo(i);
  else if(ctx.type==='blitz') resolveBlitz(i);
  else resolveDuel(i);
}
function resolveSolo(i){
  const p=S.players[ctx.answerer], q=ctx.q; ctx.done=true; ctx.picked=i;
  if(i===q.correct){p.score+=ctx.value;p.right++;ctx.msg=`Верно! ${p.name} получает +${pts(ctx.value)}`;ctx.statusCls='good';sfx.good();log(`${p.name} верно отвечает (${CATS[q.cat].name}): +${ctx.value}`)}
  else{
    p.score-=ctx.penalty;
    ctx.msg=(i<0?'Время вышло. ':'Неверно. ')+`Ответ: ${q.opts[q.correct]}`+(ctx.penalty?` · −${ctx.penalty}`:'');
    ctx.statusCls='bad'; sfx.bad(); log(`${p.name} ошибается (${CATS[q.cat].name})${ctx.penalty?': −'+ctx.penalty:''}`);
  }
  renderQ(); renderSide();
}

/* ---------- Блиц ---------- */
function startBlitz(){
  const cat=pick(Object.keys(CATS));
  ctx={type:'blitz', q:getQ(cat,2), answerer:null, eligible:S.players.map((_,i)=>i), locked:new Set(), wrong:new Set(), hidden:new Set(), done:false};
  log(`Блиц! Вопрос для всех (${CATS[cat].name})`);
  renderQ(); startTimer(S.time,blitzNoOne);
}
function blitzNoOne(){ctx.done=true;ctx.msg=`${ctx.locked.size?'Больше никто не ответил':'Никто не ответил'}. Ответ: ${ctx.q.opts[ctx.q.correct]}`;ctx.statusCls='bad';sfx.bad();renderQ()}
function buzz(pi){
  if(!ctx||ctx.type==='solo'||ctx.done||ctx.answerer!==null||!ctx.eligible.includes(pi)||ctx.locked.has(pi)) return;
  ctx.answerer=pi; ctx.buzzLeft=ctx.timerEnd-Date.now(); clearTimer(); sfx.buzz();
  S.players[pi].asked++;
  renderQ(); startTimer(10,()=>answerTimeout());
}
function answerTimeout(){ if(ctx.type==='blitz') resolveBlitz(-1); else resolveDuel(-1); }
function resolveBlitz(i){
  const pi=ctx.answerer, p=S.players[pi], q=ctx.q;
  if(i===q.correct){
    ctx.done=true;ctx.picked=i;p.score+=2;p.right++;ctx.msg=`${p.name} отвечает верно: +2`;ctx.statusCls='good';sfx.good();log(`Блиц: ${p.name} +2`);renderQ();renderSide();return;
  }
  p.score-=1; ctx.locked.add(pi); if(i>=0) ctx.wrong.add(i); ctx.answerer=null; sfx.bad(); log(`Блиц: ${p.name} ошибается, −1`);
  const remain=ctx.eligible.filter(x=>!ctx.locked.has(x));
  if(!remain.length){ctx.done=true;ctx.msg=`Все ошиблись. Ответ: ${q.opts[q.correct]}`;ctx.statusCls='bad';renderQ();renderSide();return}
  ctx.msg=`${p.name} ${i<0?'не успевает':'ошибается'} (−1). Остальные — ваш шанс!`;ctx.statusCls='bad';
  renderQ();renderSide(); startTimer(Math.max(8,Math.round(S.time/2)),blitzNoOne); ctx.msg=null;
}

/* ---------- Дуэль ---------- */
function chooseOpponent(pi){
  const p=S.players[pi], opps=S.players.map((_,i)=>i).filter(i=>i!==pi);
  openModal(`
    <div class="mhead"><span class="chip" style="background:var(--felt-2)"><span class="ci" style="color:var(--gold)">⚔&#xFE0E;</span>Дуэль</span></div>
    <h2 style="font-size:22px">${esc(p.name)}, кого вызываете?</h2>
    <p class="muted" style="margin:0">Вопросы задаются обоим. Кто первым нажал свою клавишу — отвечает. Верно — очко в дуэли, ошибка — очко сопернику. Игра до двух побед: победитель +2, проигравший −1.</p>
    <div class="buzzers">${opps.map((i,k)=>`<button class="buzz" style="--pc:${S.players[i].color}" data-act="o" data-arg="${i}" data-key="${k+1}"><span class="bn">${esc(S.players[i].name)}</span><small>${S.players[i].score} ${plural(S.players[i].score,'очко','очка','очков')} · клавиша ${k+1}</small></button>`).join('')}</div>`,
    {o:(i)=>{S.duel={a:pi,b:+i,wins:[0,0],n:0};log(`${p.name} вызывает на дуэль игрока ${S.players[+i].name}`);nextDuelQ()}});
}
function nextDuelQ(){
  const D=S.duel;
  if(D.wins[0]>=2||D.wins[1]>=2||D.n>=5) return finishDuel();
  D.n++;
  const cat=pick(Object.keys(CATS));
  ctx={type:'duel', q:getQ(cat,2), answerer:null, eligible:[D.a,D.b], locked:new Set(), wrong:new Set(), hidden:new Set(), done:false, onNext:nextDuelQ};
  renderQ(); startTimer(S.time,()=>{ctx.done=true;ctx.msg=`Никто не рискнул. Ответ: ${ctx.q.opts[ctx.q.correct]}`;ctx.statusCls='bad';renderQ()});
}
function resolveDuel(i){
  const D=S.duel, pi=ctx.answerer, p=S.players[pi], q=ctx.q, other=pi===D.a?D.b:D.a;
  ctx.done=true; ctx.picked=i;
  if(i===q.correct){D.wins[pi===D.a?0:1]++;p.right++;ctx.msg=`${p.name} отвечает верно!`;ctx.statusCls='good';sfx.good()}
  else{D.wins[other===D.a?0:1]++;ctx.msg=`${p.name} ${i<0?'не успевает':'ошибается'} — очко получает ${S.players[other].name}. Ответ: ${q.opts[q.correct]}`;ctx.statusCls='bad';sfx.bad()}
  renderQ();
}
function finishDuel(){
  const D=S.duel, A=S.players[D.a], B=S.players[D.b];
  let html;
  if(D.wins[0]===D.wins[1]){html=`<h2 style="font-size:24px" class="center-txt">Ничья ${D.wins[0]} : ${D.wins[1]}</h2><p class="muted center-txt" style="margin:0">Очки никто не теряет.</p>`;log(`Дуэль ${A.name} и ${B.name}: ничья`)}
  else{
    const w=D.wins[0]>D.wins[1]?A:B, l=w===A?B:A; w.score+=2; l.score-=1;
    html=`<div class="cardbig"><span class="ci">⚔&#xFE0E;</span><div class="eyebrow">Победитель дуэли</div><h2 style="font-size:28px;color:${w.color}">${esc(w.name)}</h2><div class="duelbar"><span class="vs">${D.wins[0]} : ${D.wins[1]}</span></div><p style="margin:0">${esc(w.name)} +2 · ${esc(l.name)} −1</p></div>`;
    log(`Дуэль: ${w.name} побеждает ${l.name} (${Math.max(...D.wins)}:${Math.min(...D.wins)})`); sfx.good();
  }
  S.duel=null; renderSide();
  openModal(`${html}<div class="mfoot"><span></span><button class="btn primary" data-act="next" data-default>Дальше <kbd style="margin-left:6px">Enter</kbd></button></div>`,{next:endTurn});
}

/* ---------- Шанс ---------- */
function drawChance(pi){
  const p=S.players[pi], card=pick(CHANCE);
  openModal(`<div class="cardbig"><span class="ci">?</span><div class="eyebrow">Карта судьбы · ${esc(p.name)}</div><h2 style="font-size:28px">${card.t}</h2><p style="margin:0;font-size:17px">${card.d}</p></div>
    <div class="mfoot"><span></span><button class="btn primary" data-act="ok" data-default>Принять <kbd style="margin-left:6px">Enter</kbd></button></div>`,
    {ok:()=>{
      if(card.special==='riddle'){log(`${p.name} тянет «Загадку мудреца»`);return askSolo(pi,'logic',3,4,0,'Загадка мудреца')}
      if(card.special==='portal'){p.pos=12;S.landed=12;log(`${p.name} проходит через портал к Дуэли`);renderAll();return chooseOpponent(pi)}
      log(card.f(p,pi)); renderAll(); endTurn();
    }});
}

/* ---------- Финал ---------- */
function endGame(){
  clearTimer(); S.busy=true;
  const order=S.players.map((p,i)=>({...p,i})).sort((a,b)=>b.score-a.score||b.right-a.right);
  const top=order[0], tie=order.filter(p=>p.score===top.score&&p.right===top.right).length>1;
  renderAll();
  openModal(`
    <div class="center-txt" style="display:grid;gap:8px"><div class="eyebrow">Игра окончена</div>
    <h2 style="font-size:clamp(24px,4vw,36px)">${tie?'Ничья на вершине!':`Побеждает <span style="color:${top.color}">${esc(top.name)}</span>`}</h2>
    <p class="muted" style="margin:0">При равенстве очков выше тот, у кого больше верных ответов.</p></div>
    <div class="rank">${order.map((p,k)=>`<div class="r" style="--pc:${p.color}"><span class="pos">${k+1}</span><div style="min-width:0"><b>${esc(p.name)}</b><div class="muted" style="font-size:13px">Верных ответов: ${p.right} из ${p.asked}</div></div><span class="pts" style="color:${p.color}">${p.score}</span></div>`).join('')}</div>
    <div class="mfoot"><button class="btn" data-act="setup">Новые игроки</button><button class="btn primary" data-act="again" data-default>Сыграть ещё раз</button></div>`,
    {again:()=>{closeModal();startGame()}, setup:()=>{S=null;renderSetup()}});
}

/* ================== КЛАВИАТУРА ================== */
document.addEventListener('keydown',e=>{
  const tag=(e.target.tagName||'');
  if(tag==='INPUT'||tag==='SELECT') return;
  if(e.repeat) return;
  const modalOpen=!$('#overlay').hidden;
  // кнопки блица
  const bi=BUZZ.findIndex(b=>b.code===e.code);
  if(modalOpen&&bi>=0&&ctx&&ctx.type!=='solo'&&S&&bi<S.players.length){e.preventDefault();buzz(bi);return}
  const dm=/^(Digit|Numpad)([1-8])$/.exec(e.code);
  if(modalOpen&&dm){const b=$(`#modal [data-key="${dm[2]}"]`);if(b&&!b.disabled){e.preventDefault();b.click()}return}
  if(e.code==='Space'||e.code==='Enter'||e.code==='NumpadEnter'){
    if(modalOpen){
      e.preventDefault();
      if(e.target.tagName==='BUTTON'&&$('#modal').contains(e.target)&&!e.target.disabled){e.target.click();return}
      const b=$('#modal [data-default]'); if(b&&!b.disabled) b.click();
    }else if(S&&!S.busy&&$('#rollBtn')){e.preventDefault();roll()}
  }
});

renderSetup();
</script>
</body>
</html>
