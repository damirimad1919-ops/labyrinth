<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Лабиринт знаний — онлайн</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Unbounded:wght@500;700;800&display=swap">
<style>
/* Онлайн-версия: каждый игрок на своём телефоне. Ведущий (создатель комнаты) хранит игру, остальные получают её состояние. */
[hidden]{display:none!important}
:root{
  --table:#141a2f; --felt:#1d2645; --felt-2:#283461; --line:#3b4778;
  --ink:#f2eee4; --muted:#a6aecb; --gold:#e9c46a;
  --hist:#b5523b; --geo:#3f8a5c; --sci:#3b6fb5; --lit:#8a4fa0; --logic:#c48419; --math:#23878d; --nature:#6b8a1e; --misc:#a8456d;
  --good:#4fbf7f; --bad:#e5534b;
  --display:'Unbounded','Arial Black',system-ui,sans-serif;
  --body:'Golos Text',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--table);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent;
  background-image:radial-gradient(ellipse at 30% 20%, #1e2850 0%, transparent 60%),radial-gradient(ellipse at 80% 90%, #22193d 0%, transparent 55%);background-attachment:fixed}
.wrap{padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));padding-top:max(14px,env(safe-area-inset-top,0px));padding-bottom:max(28px,env(safe-area-inset-bottom,0px));max-width:1280px;margin:0 auto}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;letter-spacing:-.01em}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.btn{border:0;border-radius:12px;padding:13px 20px;font-weight:600;background:var(--felt-2);color:var(--ink);transition:transform .12s, background .12s}
.btn:hover:not(:disabled){background:#34417a}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--gold);color:#1a1606}
.btn.primary:hover:not(:disabled){background:#f3d385}
.btn.big{font-size:18px;padding:16px 22px;width:100%}
.btn.sm{padding:8px 12px;font-size:13px}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.center-txt{text-align:center}
input.field,select.field{width:100%;background:var(--table);border:1px solid var(--line);border-radius:10px;padding:13px 14px;color:var(--ink);font:inherit;font-size:16px;min-width:0}
.card{background:var(--felt);border:1px solid var(--line);border-radius:16px;padding:18px}

/* Home */
.home{max-width:560px;margin:0 auto;display:grid;gap:18px}
.home h1{font-size:clamp(32px,9vw,54px);font-weight:800;line-height:1.02}
.home h1 span{color:var(--gold)}
.home .lead{color:var(--muted);margin:0}
.stack{display:grid;gap:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row>*{flex:1 1 auto}
.err{color:var(--bad);font-weight:600;min-height:1.2em}
.netbadge{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.netbadge i{width:8px;height:8px;border-radius:50%;background:var(--bad)}
.netbadge.ok i{background:var(--good)}

/* Lobby */
.lobby{max-width:720px;margin:0 auto;display:grid;gap:16px}
.code{font-family:var(--display);font-size:clamp(38px,11vw,64px);font-weight:800;letter-spacing:.12em;color:var(--gold);line-height:1;font-variant-numeric:tabular-nums}
.share{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:center}
.qr{background:#fff;padding:8px;border-radius:12px;width:156px;height:156px;display:grid;place-items:center}
.qr img,.qr canvas{display:block;width:140px!important;height:140px!important}
.link{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.plist{display:grid;gap:8px}
.pitem{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--felt-2);border-radius:12px;padding:12px 14px}
.dot{width:12px;height:12px;border-radius:50%}
.tag{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:99px;background:var(--table);color:var(--muted)}
.tag.me{background:var(--gold);color:#1a1606}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.opts label{display:grid;gap:6px;font-size:13px;color:var(--muted)}

/* Game */
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.topbar .t{font-family:var(--display);font-weight:700;font-size:16px}
.topbar .t span{color:var(--gold)}
.game{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:start}
.board{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-template-rows:repeat(7,minmax(0,1fr));gap:4px;
  aspect-ratio:1;width:100%;max-width:min(100%,80vh);margin:0 auto;background:var(--felt);border:1px solid var(--line);border-radius:16px;padding:6px}
.cell{position:relative;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#fff;min-width:0;overflow:hidden;box-shadow:inset 0 -3px 0 rgba(0,0,0,.22)}
.cell .ci{font-size:clamp(13px,2.6vw,28px);line-height:1;font-weight:700}
.cell .cl{font-size:clamp(7px,.85vw,11px);font-weight:600;letter-spacing:.04em;text-transform:uppercase;opacity:.9;text-align:center;padding:0 2px;line-height:1.1}
.cell.sp{background:var(--felt-2);box-shadow:inset 0 0 0 2px var(--line)}
.cell.sp .ci{color:var(--gold)}
.cell.start{background:var(--gold);color:#1a1606}
.cell.start .ci{color:#1a1606}
.tokens{position:absolute;bottom:3px;left:0;right:0;display:flex;justify-content:center;gap:1px;flex-wrap:wrap}
.tok{width:clamp(8px,1.5vw,15px);height:clamp(8px,1.5vw,15px);border-radius:50%;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.5)}
.tok.cur{animation:bob 1s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
.center{grid-row:2/7;grid-column:2/7;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(5px,1.4vw,14px);text-align:center;padding:6px;min-width:0}
.center .who{font-family:var(--display);font-size:clamp(14px,2.6vw,26px);font-weight:700;overflow-wrap:anywhere}
.center .who b{color:var(--pc)}
.dice{width:clamp(48px,10vw,92px);aspect-ratio:1;background:#f6f2e8;border-radius:18%;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:14%;gap:6%;box-shadow:0 5px 0 #bfb7a3,0 10px 22px rgba(0,0,0,.4)}
.dice i{border-radius:50%}
.dice i.on{background:#1d2645}
.dice.rolling{animation:shake .12s linear infinite}
@keyframes shake{0%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}100%{transform:rotate(-8deg)}}
.center .last{font-size:clamp(11px,1.3vw,14px);color:var(--muted);max-width:34ch;min-height:2.6em}
.mini-timer{width:min(220px,70%);height:5px;background:var(--table);border-radius:99px;overflow:hidden}
.mini-timer>i,.timer>i{display:block;height:100%;width:100%;background:var(--gold);border-radius:99px}
.side{display:grid;gap:14px}
.players{display:grid;gap:8px}
.pl{display:grid;grid-template-columns:6px minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--felt);border:1px solid var(--line);border-radius:12px;padding:10px 14px 10px 0;overflow:hidden}
.pl .stripe{align-self:stretch;background:var(--pc)}
.pl.active{border-color:var(--pc);box-shadow:0 0 0 1px var(--pc)}
.pl .nm{font-weight:700;overflow-wrap:anywhere}
.pl .meta{font-size:12px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
.pl .sc{font-family:var(--display);font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--pc)}
.log{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:6px;font-size:13px;color:var(--muted);max-height:200px;overflow:auto}
.log li:first-child{color:var(--ink)}
.myturn{background:var(--gold);color:#1a1606;border-radius:12px;padding:10px 14px;font-weight:700;text-align:center;margin-bottom:12px;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{filter:brightness(1.15)}}

/* Modal */
.overlay{position:fixed;inset:0;background:rgba(8,10,22,.8);backdrop-filter:blur(4px);display:grid;place-items:center;z-index:50;overflow:auto;
  padding:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.modal{width:100%;max-width:760px;background:var(--felt);border:1px solid var(--line);border-radius:18px;padding:clamp(16px,3vw,28px);display:grid;gap:16px}
.mhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:8px;border-radius:99px;padding:6px 14px 6px 8px;font-weight:600;font-size:14px;color:#fff}
.chip .ci{width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.22);display:grid;place-items:center;font-size:13px}
.stars{color:var(--gold);letter-spacing:2px}
.qtext{font-family:var(--display);font-size:clamp(18px,4.6vw,26px);font-weight:500;line-height:1.3}
.answers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.ans{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center;text-align:left;background:var(--felt-2);border:2px solid transparent;border-radius:12px;padding:14px 16px;font-size:16px;font-weight:500}
.ans:hover:not(:disabled){border-color:var(--gold)}
.ans:disabled{cursor:default}
.ans.active{border-color:color-mix(in srgb,var(--gold) 60%,transparent)}
.ans .k{font-size:12px;font-weight:700;width:26px;height:26px;border-radius:7px;display:grid;place-items:center;background:var(--table);color:var(--muted)}
.ans.gone{visibility:hidden}
.ans.right{background:color-mix(in srgb,var(--good) 30%,var(--felt-2));border-color:var(--good)}
.ans.wrong{background:color-mix(in srgb,var(--bad) 28%,var(--felt-2));border-color:var(--bad);opacity:.85}
.ans.dim{opacity:.4}
.timer{height:8px;background:var(--table);border-radius:99px;overflow:hidden}
.timer.low>i,.mini-timer.low>i{background:var(--bad)}
.status{font-weight:600;font-size:16px}
.status.good{color:var(--good)}.status.bad{color:var(--bad)}
.buzzbig{width:100%;border:0;border-radius:18px;padding:22px;font-family:var(--display);font-size:clamp(22px,6vw,32px);font-weight:800;background:var(--pc);color:#141a2f;box-shadow:inset 0 -6px 0 rgba(0,0,0,.25);letter-spacing:.02em}
.buzzbig:active{transform:translateY(3px);box-shadow:inset 0 -3px 0 rgba(0,0,0,.25)}
.who-row{display:flex;gap:8px;flex-wrap:wrap}
.who-row span{border:2px solid var(--pc);border-radius:99px;padding:4px 12px;font-size:13px;font-weight:600}
.who-row span.on{background:var(--pc);color:#141a2f}
.who-row span.locked{opacity:.35;text-decoration:line-through}
.choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.choices.four{grid-template-columns:repeat(4,minmax(0,1fr))}
.choice{border:0;border-radius:12px;padding:16px 10px;display:grid;gap:6px;justify-items:center;text-align:center;color:#fff;font-weight:600;box-shadow:inset 0 -4px 0 rgba(0,0,0,.25)}
.choice .ci{font-size:26px;line-height:1}
.choice small{font-weight:500;opacity:.85;font-size:12px}
.diff{background:var(--felt-2);color:var(--ink)}
.diff b{font-family:var(--display);font-size:22px}
.cardbig{border-radius:16px;padding:24px;background:linear-gradient(140deg,var(--felt-2),#3a2f6b);border:1px solid var(--line);text-align:center;display:grid;gap:10px}
.cardbig .ci{font-size:42px;color:var(--gold);line-height:1}
.duelbar{display:flex;justify-content:center;align-items:center;gap:14px;font-family:var(--display);font-size:18px;flex-wrap:wrap}
.duelbar .vs{font-size:26px;font-variant-numeric:tabular-nums}
.oppbtn{border:2px solid var(--pc);background:color-mix(in srgb,var(--pc) 14%,var(--felt));border-radius:12px;padding:14px;text-align:left;display:grid;gap:2px}
.oppbtn small{color:var(--muted)}
.rank{display:grid;gap:10px}
.rank .r{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--felt-2);border-radius:12px;padding:12px 16px;border-left:6px solid var(--pc)}
.rank .pos{font-family:var(--display);font-size:22px;color:var(--muted)}
.rank .r:first-child{background:color-mix(in srgb,var(--gold) 22%,var(--felt-2))}
.rank .r:first-child .pos{color:var(--gold)}
.rank .pts{font-family:var(--display);font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.waiting{display:flex;gap:10px;align-items:center;justify-content:center;color:var(--muted);font-weight:500}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--gold);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:max(16px,env(safe-area-inset-bottom,0px));background:var(--bad);color:#fff;padding:10px 16px;border-radius:12px;font-weight:600;z-index:60;max-width:calc(100% - 32px);text-align:center}

@media (max-width:960px){
  .game{grid-template-columns:minmax(0,1fr)}
  .players{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:560px){
  .cell .cl{display:none}
  .answers{grid-template-columns:minmax(0,1fr)}
  .choices,.choices.four{grid-template-columns:repeat(2,minmax(0,1fr))}
  .board{padding:4px;gap:3px}
  .share{grid-template-columns:minmax(0,1fr);justify-items:center;text-align:center}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<script>
/* ================== НАСТРОЙКИ СЕТИ ================== */

/* ================== ДАННЫЕ ================== */

const $ = s=>document.querySelector(s);

const rnd = (a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick = a=>a[Math.floor(Math.random()*a.length)];
const shuffle = a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function plural(n,a,b,c){n=Math.abs(n)%100;const n1=n%10;if(n>10&&n<20)return c;if(n1>1&&n1<5)return b;if(n1===1)return a;return c}
const pts = n=>`${n} ${plural(n,'очко','очка','очков')}`;
const store = {get(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}}, set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

let AC=null;
function beep(f=440,d=.12,type='sine',v=.08){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(AC.destination);const t=AC.currentTime;g.gain.exponentialRampToValueAtTime(.0001,t+d);o.start(t);o.stop(t+d)}catch(e){}}
const sfx={good(){beep(660,.1);setTimeout(()=>beep(880,.16),90)},bad(){beep(200,.25,'sawtooth',.05)},buzz(){beep(520,.08,'square',.05)},turn(){beep(523,.1);setTimeout(()=>beep(659,.1),110);setTimeout(()=>beep(784,.15),220);try{navigator.vibrate&&navigator.vibrate([80,60,80])}catch(e){}}};

/* ================== МАТЕМАТИКА ================== */
function distract(c, extra=[]){
  const cand = shuffle([...extra, c+1,c-1,c+2,c-2,c+10,c-10,c+5,c-5,c*2,Math.round(c*1.1)]).filter(x=>x!==c&&x>=0&&Number.isInteger(x));
  const out=[];for(const x of cand){if(!out.includes(x))out.push(x);if(out.length===3)break}
  while(out.length<3){const x=c+rnd(3,20);if(!out.includes(x)&&x!==c)out.push(x)}
  return out;
}
function genMath(d){
  let text,c,ex=[];
  const t = d===1?pick(['add','mul','sub']):d===2?pick(['mix','pct','eq','sq']):pick(['mul2','gcd','sum','pow','diff']);
  switch(t){
    case 'add':{const a=rnd(12,89),b=rnd(12,89);text=`${a} + ${b} = ?`;c=a+b;break}
    case 'sub':{const a=rnd(40,99),b=rnd(11,a-5);text=`${a} − ${b} = ?`;c=a-b;break}
    case 'mul':{const a=rnd(3,9),b=rnd(4,12);text=`${a} × ${b} = ?`;c=a*b;ex=[a*(b+1),a*(b-1)];break}
    case 'mix':{const a=rnd(6,15),b=rnd(4,9),k=rnd(10,50);text=`${a} × ${b} + ${k} = ?`;c=a*b+k;ex=[a*(b+k),a*b-k];break}
    case 'pct':{const p=pick([10,20,25,50,75]),n=rnd(2,20)*20;text=`Сколько будет ${p}% от ${n}?`;c=n*p/100;break}
    case 'eq':{const x=rnd(2,12),a=rnd(2,9),b=rnd(1,20);text=`Найдите x: ${a}x + ${b} = ${a*x+b}`;c=x;ex=[x+1,x-1,x+2];break}
    case 'sq':{const n=rnd(11,25);text=`${n}² = ?`;c=n*n;ex=[n*n+n,n*n-n,n*2];break}
    case 'mul2':{const a=rnd(12,39),b=rnd(12,39);text=`${a} × ${b} = ?`;c=a*b;ex=[c+a,c-b,c+10];break}
    case 'gcd':{const g=rnd(6,18),[m,n]=pick([[2,3],[3,4],[2,5],[3,5],[4,5],[5,6],[3,7],[4,7],[5,7],[2,7]]);text=`Наибольший общий делитель чисел ${g*m} и ${g*n}?`;c=g;ex=[g*2,Math.max(1,g/2|0),g+1,g*m];break}
    case 'sum':{const n=pick([20,30,40,50,100]);text=`Сумма всех чисел от 1 до ${n}?`;c=n*(n+1)/2;ex=[n*n/2,n*(n-1)/2,c+n];break}
    case 'pow':{const n=rnd(8,12);text=`2 в степени ${n} = ?`;c=2**n;ex=[2**(n-1),2**(n+1),c+2];break}
    case 'diff':{const a=rnd(30,60),b=rnd(20,a-3);text=`${a}² − ${b}² = ?`;c=a*a-b*b;ex=[(a-b)**2,c+10,c-a];break}
  }
  const opts = shuffle([c,...distract(c,ex)]).map(String);
  return {text, opts, correct:opts.indexOf(String(c)), cat:'math', d};
}

/* ================== СЕТЬ ================== */
const params = new URLSearchParams(location.search);
const BROKER = params.get('broker') || DEFAULT_BROKER;
const ME = store.get('lz-id', null) || (()=>{const id=uid();store.set('lz-id',id);return id})();
let myName = store.get('lz-name','');
let client=null, room=null, isHost=false, connected=false;
let V=null;          // последнее полученное состояние игры (видят все)
let G=null;          // полное состояние (только у ведущего)
let lastMsgAt=0, localDeadline=0, localTotal=1, lastRollAt=0, lastTurnKey='', lastJoinSent=0;

function connect(onReady){
  if(client){ if(connected) onReady(); else client.once('connect',onReady); return; }
  if(!window.mqtt){ toast('Не удалось загрузить сетевой модуль. Проверьте интернет и обновите страницу.'); return; }
  client = mqtt.connect(BROKER,{clientId:'lz_'+uid(), clean:true, reconnectPeriod:2000, connectTimeout:10000, keepalive:30});
  client.on('connect',()=>{connected=true; hideToast(); render(); subscribe(); });
  client.on('reconnect',()=>{connected=false; render()});
  client.on('offline',()=>{connected=false; toast('Нет связи с сервером. Переподключаемся…'); render()});
  client.on('error',e=>{connected=false; toast('Ошибка связи: '+(e&&e.message||e))});
  client.on('message',onMessage);
  client.once('connect',onReady);
}
function subscribe(){
  if(!client||!room) return;
  if(isHost) client.subscribe(TOPIC+room+'/act',{qos:1});
  client.subscribe(TOPIC+room+'/state',{qos:1});
}
function onMessage(topic,buf){
  let msg; try{msg=JSON.parse(buf.toString())}catch(e){return}
  if(topic===TOPIC+room+'/state'){
    if(isHost) return;               // ведущий рисует из своего состояния
    if(!msg||msg.room!==room) return;
    receiveView(msg);
  } else if(isHost && topic===TOPIC+room+'/act'){
    if(msg&&msg.from) hostAction(msg.from,msg);
  }
}
function receiveView(view){
  if(V&&view.rev===V.rev){ lastMsgAt=Date.now(); if(view.timer){localDeadline=Date.now()+view.timer.remain} return; }
  const prevPhase=V&&V.phase;
  V=view; lastMsgAt=Date.now();
  if(V.timer){localDeadline=Date.now()+V.timer.remain; localTotal=V.timer.total} else localDeadline=0;
  // автоматически войти в лобби
  if(!isHost && V.phase==='lobby' && !V.players.some(p=>p.id===ME) && myName && Date.now()-lastJoinSent>2500){ lastJoinSent=Date.now(); send({type:'join',name:myName}); }
  // сигнал «ваш ход»
  const key=V.phase+':'+V.rev;
  const meActs = needsMe();
  if(meActs && V.phase!==prevPhase) sfx.turn();
  if(V.flash && V.flash.at!==(window._flashAt)){window._flashAt=V.flash.at; V.flash.good?sfx.good():sfx.bad()}
  render();
}
function send(act){
  act.from=ME;
  if(isHost){ hostAction(ME,act); return; }
  if(!client||!connected){ toast('Нет связи — действие не отправлено'); return; }
  client.publish(TOPIC+room+'/act',JSON.stringify(act),{qos:1});
}

/* ================== ЛОГИКА ВЕДУЩЕГО ================== */
function hostCreate(){
  room=String(rnd(100000,999999)); isHost=true;
  G={room, rev:0, phase:'lobby', hostId:ME, players:[], settings:{rounds:8,time:20}, cur:0, round:1, dice:1, rollAt:0, log:[], used:[], q:null, secret:null, timer:null, extra:false, duel:null};
  addPlayer(ME,myName);
  store.set('lz-host',{room, at:Date.now()});
  history.replaceState(null,'','?room='+room+(params.get('broker')?'&broker='+encodeURIComponent(BROKER):''));
  connect(()=>commit());
}
function hostResume(saved){
  G=saved; room=G.room; isHost=true;
  connect(()=>{ if(G.timer){ G.timer.at=Date.now()+Math.max(3000,G.timer.left||0) } commit(); });
}
function addPlayer(id,name){
  const used=G.players.map(p=>p.color); const color=PCOLORS.find(c=>!used.includes(c));
  G.players.push({id,name:(name||'Игрок').slice(0,16),color,score:0,pos:0,joker:1,right:0,asked:0});
}
function log(m){G.log.unshift(m);G.log=G.log.slice(0,25)}
const P=i=>G.players[i];
const idx=id=>G.players.findIndex(p=>p.id===id);
function commit(){
  G.rev++;
  const view=publicView();
  if(client&&connected) client.publish(TOPIC+room+'/state',JSON.stringify(view),{qos:1,retain:true});
  const save=JSON.parse(JSON.stringify(G)); if(save.timer) save.timer.left=save.timer.at-Date.now();
  store.set('lz-game-'+room,save);
  receiveHostView(view);
}
function receiveHostView(view){
  const prevPhase=V&&V.phase;
  V=view; lastMsgAt=Date.now();
  if(V.timer){localDeadline=G.timer.at; localTotal=V.timer.total} else localDeadline=0;
  if(needsMe() && V.phase!==prevPhase) sfx.turn();
  if(V.flash && V.flash.at!==(window._flashAt)){window._flashAt=V.flash.at; V.flash.good?sfx.good():sfx.bad()}
  render();
}
function publicView(){
  const v={...G}; delete v.secret; delete v.used;
  v.timer = G.timer?{remain:Math.max(0,G.timer.at-Date.now()), total:G.timer.total}:null;
  return v;
}
function setTimer(sec,what){G.timer={at:Date.now()+sec*1000,total:sec*1000,what}}
function clearTimerG(){G.timer=null}
setInterval(()=>{
  if(!isHost||!G) return;
  if(G.timer && Date.now()>=G.timer.at){ const w=G.timer.what; G.timer=null; hostTimeout(w); }
},200);
// «пульс» ведущего: раз в 12 секунд повторно отправляем состояние
setInterval(()=>{ if(isHost&&G&&client&&connected){ client.publish(TOPIC+room+'/state',JSON.stringify(publicView()),{qos:1,retain:true}) } },12000);

function getQ(cat,d){
  if(cat==='math') return genMath(d);
  const used=new Set(G.used);
  let pool = Q.filter(q=>q[0]===cat&&q[1]===d&&!used.has(q.id));
  if(!pool.length) pool = Q.filter(q=>q[0]===cat&&!used.has(q.id));
  if(!pool.length){ G.used=G.used.filter(id=>Q[id][0]!==cat); pool = Q.filter(q=>q[0]===cat&&q[1]===d); }
  const q = pick(pool); G.used.push(q.id);
  const opts = shuffle(q.slice(3,7));
  return {text:q[2], opts, correct:opts.indexOf(q[3]), cat, d:q[1]};
}
const leaderIndex=()=>G.players.reduce((b,p,i,a)=>p.score>a[b].score?i:b,0);
const lastIndex=()=>G.players.reduce((b,p,i,a)=>p.score<a[b].score?i:b,0);

function hostAction(from,a){
  const pi=idx(from);
  const isMeHost = from===G.hostId;
  switch(a.type){
    case 'join':
      if(pi>=0){ if(a.name) P(pi).name=String(a.name).slice(0,16); return commit(); }
      if(G.phase!=='lobby'||G.players.length>=MAX_PLAYERS) return commit();
      addPlayer(from,String(a.name||'Игрок')); log(`${String(a.name||'Игрок').slice(0,16)} входит в комнату`); return commit();
    case 'remove': if(isMeHost&&G.phase==='lobby'&&a.id!==G.hostId){G.players=G.players.filter(p=>p.id!==a.id);commit()} return;
    case 'settings': if(isMeHost&&G.phase==='lobby'){G.settings.rounds=+a.rounds||8;G.settings.time=+a.time||20;commit()} return;
    case 'start': if(isMeHost&&G.phase==='lobby'&&G.players.length>=2) startGame(); return;
    case 'finish': if(isMeHost&&G.phase!=='lobby') endGame(); return;
    case 'lobby': if(isMeHost){G.phase='lobby';G.q=null;clearTimerG();commit()} return;
    case 'skip': if(isMeHost&&['roll','diff','cat','opp','chance'].includes(G.phase)){log(`Ведущий пропускает ход игрока ${P(G.cur).name}`);endTurn()} return;
  }
  if(pi<0) return;
  switch(a.type){
    case 'roll': if(G.phase==='roll'&&pi===G.cur) doRoll(); break;
    case 'diff': if(G.phase==='diff'&&pi===G.cur) chooseDiff(+a.d); break;
    case 'cat': if(G.phase==='cat'&&pi===G.cur&&CATS[a.c]) chooseCat(a.c); break;
    case 'opp': if(G.phase==='opp'&&pi===G.cur) chooseOpp(+a.o); break;
    case 'accept': if(G.phase==='chance'&&pi===G.cur) acceptChance(); break;
    case 'buzz': buzz(pi); break;
    case 'answer': answer(pi,+a.i); break;
    case 'joker': useJoker(pi); break;
  }
}
function hostTimeout(w){
  switch(w){
    case 'roll': log(`${P(G.cur).name} долго думает — кубик брошен автоматически`); doRoll(); break;
    case 'step': step(); break;
    case 'land': landOn(); break;
    case 'diff': chooseDiff(2); break;
    case 'cat': chooseCat(pick(Object.keys(CATS))); break;
    case 'opp': chooseOpp(pick(G.players.map((_,i)=>i).filter(i=>i!==G.cur))); break;
    case 'chance': acceptChance(); break;
    case 'answer': resolve(-1); break;
    case 'buzz': noOne(); break;
    case 'reveal': G.after==='duel'?nextDuelQ():endTurn(); break;
    case 'duelEnd': endTurn(); break;
  }
}
function startGame(){
  G.players.forEach(p=>{p.score=0;p.pos=0;p.joker=1;p.right=0;p.asked=0});
  G.cur=0; G.round=1; G.log=[]; G.used=[]; G.q=null; G.extra=false; G.duel=null; G.flash=null;
  log(`Игра началась! ${G.settings.rounds} ${plural(G.settings.rounds,'раунд','раунда','раундов')}. Первым ходит ${P(0).name}.`);
  G.phase='roll'; setTimer(45,'roll'); commit();
}
function doRoll(){
  const n=rnd(1,6); G.dice=n; G.rollAt=Date.now(); G.steps=n; G.phase='moving';
  log(`${P(G.cur).name} выбрасывает ${n}`); setTimer(0.9,'step'); commit();
}
function step(){
  const p=P(G.cur); p.pos=(p.pos+1)%BOARD.length;
  if(p.pos===0){p.score+=1;log(`${p.name} проходит Старт: +1`)}
  G.steps--; if(G.steps>0) setTimer(0.35,'step'); else setTimer(0.6,'land');
  commit();
}
function landOn(){
  const p=P(G.cur), t=BOARD[p.pos];
  if(CATS[t]){G.phase='diff';G.cat=t;setTimer(25,'diff');return commit()}
  if(t==='blitz') return startBlitz();
  if(t==='duel'){G.phase='opp';setTimer(25,'opp');return commit()}
  if(t==='choice'){G.phase='cat';setTimer(25,'cat');return commit()}
  if(t==='chance'){G.card=Math.floor(Math.random()*CHANCE.length);G.phase='chance';setTimer(15,'chance');return commit()}
  log(`${p.name} отдыхает на Старте`); endTurn();
}
function chooseCat(c){G.cat=c;G.phase='diff';setTimer(25,'diff');commit()}
function chooseDiff(d){ if(![1,2,3].includes(d)) d=2; askSolo(G.cur,G.cat,d,d,d===3?1:0,null) }
function askSolo(pi,cat,d,value,penalty,title){
  const q=getQ(cat,d);
  G.q={mode:'solo',text:q.text,opts:q.opts,cat:q.cat,d:q.d,value,penalty,title,answerer:pi,eligible:[pi],locked:[],wrong:[],hidden:[],note:null};
  G.secret={correct:q.correct}; P(pi).asked++;
  G.phase='q'; setTimer(G.settings.time,'answer'); commit();
}
function startBlitz(){
  const cat=pick(Object.keys(CATS)), q=getQ(cat,2);
  G.q={mode:'blitz',text:q.text,opts:q.opts,cat:q.cat,d:2,answerer:null,eligible:G.players.map((_,i)=>i),locked:[],wrong:[],hidden:[],note:null};
  G.secret={correct:q.correct}; log(`Блиц! Вопрос для всех (${CATS[cat].name})`);
  G.phase='q'; setTimer(G.settings.time,'buzz'); commit();
}
function chooseOpp(o){
  if(!(o>=0&&o<G.players.length)||o===G.cur) return;
  G.duel={a:G.cur,b:o,wins:[0,0],n:0}; log(`${P(G.cur).name} вызывает на дуэль игрока ${P(o).name}`); nextDuelQ();
}
function nextDuelQ(){
  const D=G.duel;
  if(D.wins[0]>=2||D.wins[1]>=2||D.n>=5) return finishDuel();
  D.n++;
  const cat=pick(Object.keys(CATS)), q=getQ(cat,2);
  G.q={mode:'duel',text:q.text,opts:q.opts,cat:q.cat,d:2,answerer:null,eligible:[D.a,D.b],locked:[],wrong:[],hidden:[],note:null};
  G.secret={correct:q.correct}; G.phase='q'; setTimer(G.settings.time,'buzz'); commit();
}
function buzz(pi){
  const q=G.q; if(G.phase!=='q'||!q||q.mode==='solo'||q.answerer!==null||!q.eligible.includes(pi)||q.locked.includes(pi)) return;
  q.answerer=pi; q.note=null; P(pi).asked++; setTimer(12,'answer'); commit();
}
function useJoker(pi){
  const q=G.q, p=P(pi); if(G.phase!=='q'||!q||q.mode!=='solo'||q.answerer!==pi||p.joker<=0||q.hidden.length) return;
  p.joker--; q.hidden=shuffle(q.opts.map((_,i)=>i).filter(i=>i!==G.secret.correct)).slice(0,2);
  log(`${p.name} берёт подсказку 50/50`); commit();
}
function answer(pi,i){
  const q=G.q; if(G.phase!=='q'||!q||q.answerer!==pi||!(i>=0&&i<4)||q.hidden.includes(i)||q.wrong.includes(i)) return;
  resolve(i);
}
function reveal(picked,msg,good,after){
  G.q.correct=G.secret.correct; G.q.picked=picked; G.q.msg=msg; G.q.good=good;
  G.flash={at:Date.now(),good}; G.after=after; G.phase='reveal'; setTimer(after==='duel'?4:5,'reveal'); commit();
}
function resolve(i){
  const q=G.q, c=G.secret.correct, p=q.answerer!==null?P(q.answerer):null, ans=q.opts[c];
  if(q.mode==='solo'){
    if(i===c){p.score+=q.value;p.right++;log(`${p.name} верно отвечает (${CATS[q.cat].name}): +${q.value}`);return reveal(i,`Верно! ${p.name} получает +${pts(q.value)}`,true,'end')}
    p.score-=q.penalty; log(`${p.name} ошибается (${CATS[q.cat].name})${q.penalty?': −'+q.penalty:''}`);
    return reveal(i,(i<0?'Время вышло. ':'Неверно. ')+`Ответ: ${ans}`+(q.penalty?` · −${q.penalty}`:''),false,'end');
  }
  if(q.mode==='blitz'){
    if(i===c){p.score+=2;p.right++;log(`Блиц: ${p.name} +2`);return reveal(i,`${p.name} отвечает верно: +2`,true,'end')}
    p.score-=1; q.locked.push(q.answerer); if(i>=0) q.wrong.push(i); log(`Блиц: ${p.name} ошибается, −1`);
    q.answerer=null;
    if(!q.eligible.some(x=>!q.locked.includes(x))) return reveal(-1,`Все ошиблись. Ответ: ${ans}`,false,'end');
    q.note=`${p.name} ${i<0?'не успевает':'ошибается'} (−1). Остальные — ваш шанс!`; G.flash={at:Date.now(),good:false};
    setTimer(Math.max(8,Math.round(G.settings.time/2)),'buzz'); return commit();
  }
  // дуэль
  const D=G.duel, pi=q.answerer, other=pi===D.a?D.b:D.a;
  if(i===c){D.wins[pi===D.a?0:1]++;p.right++;return reveal(i,`${p.name} отвечает верно!`,true,'duel')}
  D.wins[other===D.a?0:1]++;
  return reveal(i,`${p.name} ${i<0?'не успевает':'ошибается'} — очко получает ${P(other).name}. Ответ: ${ans}`,false,'duel');
}
function noOne(){
  const q=G.q, ans=q.opts[G.secret.correct];
  reveal(-1,(q.locked.length?'Больше никто не ответил. ':'Никто не ответил. ')+`Ответ: ${ans}`,false,q.mode==='duel'?'duel':'end');
}
function finishDuel(){
  const D=G.duel, A=P(D.a), B=P(D.b);
  if(D.wins[0]===D.wins[1]){G.duelResult={draw:true,score:D.wins.join(' : ')};log(`Дуэль ${A.name} и ${B.name}: ничья`)}
  else{const wi=D.wins[0]>D.wins[1]?D.a:D.b, li=wi===D.a?D.b:D.a; P(wi).score+=2; P(li).score-=1;
    G.duelResult={w:wi,l:li,score:D.wins.join(' : ')}; log(`Дуэль: ${P(wi).name} побеждает ${P(li).name} (${Math.max(...D.wins)}:${Math.min(...D.wins)})`)}
  G.phase='duelEnd'; G.q=null; setTimer(5,'duelEnd'); commit();
}
function acceptChance(){
  const pi=G.cur, p=P(pi), t=CHANCE[G.card].t;
  switch(t){
    case 'Озарение': p.score+=2; log(`${p.name}: +2 за озарение`); break;
    case 'Рассеянность': p.score-=1; log(`${p.name}: −1 за рассеянность`); break;
    case 'Попутный ветер': G.extra=true; log(`${p.name} ходит ещё раз`); break;
    case 'Загадка мудреца': log(`${p.name} тянет «Загадку мудреца»`); return askSolo(pi,'logic',3,4,0,'Загадка мудреца');
    case 'Налог мудрости': {const l=leaderIndex(); if(l===pi) log(`${p.name} сам лидер — налог не взимается`); else {P(l).score-=1;p.score+=1;log(`${P(l).name} отдаёт 1 очко игроку ${p.name}`)} break}
    case 'Мудрый совет': p.joker++; log(`${p.name} получает подсказку 50/50`); break;
    case 'Портал': p.pos=12; log(`${p.name} проходит через портал к Дуэли`); G.phase='opp'; setTimer(25,'opp'); return commit();
    case 'Щедрость': {const l=lastIndex(); if(l===pi) log(`${p.name} и так последний — дарить некому`); else {p.score-=1;P(l).score+=1;log(`${p.name} дарит 1 очко игроку ${P(l).name}`)} break}
  }
  endTurn();
}
function endTurn(){
  G.q=null; G.duel=null; clearTimerG();
  if(G.extra){G.extra=false}
  else{
    G.cur=(G.cur+1)%G.players.length;
    if(G.cur===0){G.round++; if(G.round>G.settings.rounds) return endGame();}
  }
  G.phase='roll'; setTimer(45,'roll'); commit();
}
function endGame(){
  clearTimerG(); G.q=null; G.phase='end'; log('Игра окончена!'); commit();
}

}

  let head;
  if(q.mode==='blitz') head=`${spChip('blitz',' · '+CATS[q.cat].name)}<span class="muted">Верно +2 · ошибка −1</span>`;
  else if(q.mode==='duel') head=`${spChip('duel',' · '+CATS[q.cat].name)}`;
  else head=`${catChip(q.cat)}<span><span class="stars">${stars(q.d)}</span> <span class="muted">${q.title?esc(q.title)+' · ':''}+${q.value}${q.penalty?` / −${q.penalty}`:''}</span></span>`;
  const D=V.duel;
  const duelbar = q.mode==='duel'&&D?`<div class="duelbar"><b style="color:${pl[D.a].color}">${esc(pl[D.a].name)}</b><span class="vs">${D.wins[0]} : ${D.wins[1]}</span><b style="color:${pl[D.b].color}">${esc(pl[D.b].name)}</b></div>`:'';
  const iAnswer = !rev && q.answerer===mi && mi>=0;
  const canBuzz = !rev && q.mode!=='solo' && q.answerer===null && q.eligible.includes(mi) && !q.locked.includes(mi);
  const whoRow = q.mode!=='solo'?`<div class="who-row">${q.eligible.map(i=>`<span style="--pc:${pl[i].color}" class="${q.answerer===i?'on':''} ${q.locked.includes(i)?'locked':''}">${esc(pl[i].name)}</span>`).join('')}</div>`:'';
  const answers=q.opts.map((o,i)=>{
    let cls='';
    if(q.hidden.includes(i)) cls='gone';
    if(q.wrong.includes(i)) cls='wrong';
    if(rev){ if(i===q.correct) cls='right'; else if(q.picked===i) cls='wrong'; else if(!q.wrong.includes(i)&&!q.hidden.includes(i)) cls='dim'; }
    if(iAnswer&&!cls) cls='active';
    return `<button class="ans ${cls}" data-a="ans" data-v="${i}" ${!iAnswer||q.hidden.includes(i)||q.wrong.includes(i)?'disabled':''}><span class="k">${i+1}</span><span>${esc(o)}</span></button>`;
  }).join('');
  let status='', cls='';
  if(rev){status=q.msg;cls=q.good?'good':'bad'}
  else if(iAnswer) status='Ваш ответ! Нажмите на вариант';
  else if(q.answerer!==null) status=`Отвечает ${pl[q.answerer].name}…`;
  else if(q.note){status=q.note;cls='bad'}
  else if(canBuzz) status='Знаете ответ? Жмите кнопку первым!';
  else status='Кто-то из игроков вот-вот нажмёт кнопку…';
  const me=mi>=0?pl[mi]:null;
  const joker = iAnswer&&q.mode==='solo'&&me.joker>0&&!q.hidden.length?`<button class="btn" data-a="joker">Подсказка 50 / 50 <span class="muted">(${me.joker})</span></button>`:'';
  return `<div class="mhead">${head}</div>${duelbar}
    <div class="qtext">${esc(q.text)}</div>
    ${whoRow}
    ${canBuzz?`<button class="buzzbig" style="--pc:${me.color}" data-a="buzz">Я знаю!</button>`:''}
    <div class="answers">${answers}</div>
    ${timerBar()}
    <div class="row" style="justify-content:space-between"><div class="status ${cls}" style="flex:1 1 200px">${esc(status)}</div>${joker?`<div style="flex:0 0 auto">${joker}</div>`:''}</div>`;
}
function closeModal(){ $('#overlay').hidden=true; $('#modal').innerHTML=''; }
$('#modal').addEventListener('click',e=>{
  const b=e.target.closest('[data-a]'); if(!b||b.disabled) return;
  const a=b.dataset.a, v=b.dataset.v;
  if(a==='buzz'){ sfx.buzz(); b.disabled=true; return send({type:'buzz'}); }
  if(a==='ans'){ document.querySelectorAll('.ans').forEach(x=>x.disabled=true); return send({type:'answer',i:+v}); }
  if(a==='diff') return send({type:'diff',d:+v});
  if(a==='cat') return send({type:'cat',c:v});
  if(a==='opp') return send({type:'opp',o:+v});
  if(a==='accept') return send({type:'accept'});
  if(a==='joker') return send({type:'joker'});
  if(a==='lobby') return send({type:'lobby'});
});
function tickTimers(){
  const els=document.querySelectorAll('[data-timer]'); if(!els.length) return;
  const left=localDeadline?Math.max(0,localDeadline-Date.now()):0;
  els.forEach(el=>{el.firstElementChild.style.width=(localDeadline?left/localTotal*100:0)+'%';el.classList.toggle('low',left<5000)});
}
setInterval(tickTimers,150);
// предупреждение, если ведущий пропал
setInterval(()=>{ if(room&&V&&!isHost&&Date.now()-lastMsgAt>40000&&V.phase!=='end') toast('Нет вестей от ведущего. Возможно, он закрыл страницу или потерял связь.'); },5000);

let toastT=null;
function toast(t,soft){const el=$('#toast');el.textContent=t;el.style.background=soft?'var(--felt-2)':'var(--bad)';el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>el.hidden=true,soft?2500:6000)}
function hideToast(){$('#toast').hidden=true}

/* ================== СТАРТ ================== */
(function boot(){
  const pr=params.get('room');
  if(pr && /^\d{6}$/.test(pr)){
    const saved=store.get('lz-game-'+pr,null);
    if(saved && saved.hostId===ME){ hostResume(saved); return render(); }
    if(myName){ joinRoom(pr); return; }
  }
  render();
})();
</script>
